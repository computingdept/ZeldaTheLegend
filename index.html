<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Phaser Room Demo</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            border: 2px solid white;
        }
    </style>
</head>
<body>

<script>

const TILE_SIZE = 64;
const ROOM_SIZE = 8;
const ROOM_PIXELS = ROOM_SIZE * TILE_SIZE;

class GameScene extends Phaser.Scene {

    constructor() {
        super();

        this.roomX = 0;
        this.roomY = 0;
    }

    create() {

        this.cursors =
            this.input.keyboard.createCursorKeys();

        this.wallGroup =
            this.physics.add.staticGroup();

        this.drawRoom();

        this.player = this.add.rectangle(
            ROOM_PIXELS / 2,
            ROOM_PIXELS / 2,
            30,
            30,
            0x00ff00
        );

        this.physics.add.existing(this.player);

        this.player.body.setCollideWorldBounds(false);

        this.physics.add.collider(
            this.player,
            this.wallGroup
        );

        this.roomText = this.add.text(
            10,
            10,
            "Room: 0,0",
            {
                fontSize: "24px",
                color: "#ffffff"
            }
        );
    }

    drawRoom() {

        this.wallGroup.clear(true, true);

        const gap = Math.floor(ROOM_SIZE / 2);

        for (let x = 0; x < ROOM_SIZE; x++) {

            if (x !== gap) {

                this.createWall(
                    x * TILE_SIZE + TILE_SIZE / 2,
                    TILE_SIZE / 2
                );

                this.createWall(
                    x * TILE_SIZE + TILE_SIZE / 2,
                    ROOM_PIXELS - TILE_SIZE / 2
                );
            }
        }

        for (let y = 1; y < ROOM_SIZE - 1; y++) {

            if (y !== gap) {

                this.createWall(
                    TILE_SIZE / 2,
                    y * TILE_SIZE + TILE_SIZE / 2
                );

                this.createWall(
                    ROOM_PIXELS - TILE_SIZE / 2,
                    y * TILE_SIZE + TILE_SIZE / 2
                );
            }
        }
    }

    createWall(x, y) {

        const wall = this.add.rectangle(
            x,
            y,
            TILE_SIZE,
            TILE_SIZE,
            0x666666
        );

        this.physics.add.existing(
            wall,
            true
        );

        this.wallGroup.add(wall);
    }

    moveToRoom(dx, dy) {

        this.roomX += dx;
        this.roomY += dy;

        this.drawRoom();

        if (dx === 1)
            this.player.x = TILE_SIZE * 1.5;

        if (dx === -1)
            this.player.x =
                ROOM_PIXELS - TILE_SIZE * 1.5;

        if (dy === 1)
            this.player.y = TILE_SIZE * 1.5;

        if (dy === -1)
            this.player.y =
                ROOM_PIXELS - TILE_SIZE * 1.5;

        this.roomText.setText(
            `Room: ${this.roomX},${this.roomY}`
        );
    }

    update() {

        const speed = 220;

        this.player.body.setVelocity(0);

        if (this.cursors.left.isDown)
            this.player.body.setVelocityX(-speed);

        if (this.cursors.right.isDown)
            this.player.body.setVelocityX(speed);

        if (this.cursors.up.isDown)
            this.player.body.setVelocityY(-speed);

        if (this.cursors.down.isDown)
            this.player.body.setVelocityY(speed);

        if (this.player.x < 0)
            this.moveToRoom(-1, 0);

        if (this.player.x > ROOM_PIXELS)
            this.moveToRoom(1, 0);

        if (this.player.y < 0)
            this.moveToRoom(0, -1);

        if (this.player.y > ROOM_PIXELS)
            this.moveToRoom(0, 1);
    }
}

const config = {
    type: Phaser.AUTO,
    width: ROOM_PIXELS,
    height: ROOM_PIXELS,
    backgroundColor: "#202020",

    physics: {
        default: "arcade",
        arcade: {
            debug: false
        }
    },

    scene: GameScene
};

new Phaser.Game(config);

</script>

</body>
</html>
