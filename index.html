<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Phaser 4x4 Room Grid</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            border: 2px solid white;
        }
    </style>
</head>
<body>

<script>

// =====================================================
// ROOM SETTINGS
// =====================================================

const TILE_SIZE = 64;
const ROOM_SIZE = 8;
const ROOM_PIXELS = ROOM_SIZE * TILE_SIZE;

// 4x4 room world
const WORLD_WIDTH = 4;
const WORLD_HEIGHT = 4;

// =====================================================
// SCENE
// =====================================================

class GameScene extends Phaser.Scene {

    constructor() {
        super();

        // Start in room A1
        this.roomX = 0;
        this.roomY = 0;
    }

    create() {

        // Arrow keys
        this.cursors =
            this.input.keyboard.createCursorKeys();

        // Static wall collection
        this.wallGroup =
            this.physics.add.staticGroup();

        // Create room label
        this.roomText = this.add.text(
            ROOM_PIXELS / 2,
            ROOM_PIXELS / 2,
            "",
            {
                fontSize: "48px",
                color: "#ffffff"
            }
        );

        this.roomText.setOrigin(0.5);

        // Draw starting room
        this.drawRoom();

        // Create player
        this.player = this.add.rectangle(
            ROOM_PIXELS / 2,
            ROOM_PIXELS / 2,
            30,
            30,
            0x00ff00
        );

        this.physics.add.existing(this.player);

        this.player.body.setCollideWorldBounds(false);

        // Player collides with walls
        this.physics.add.collider(
            this.player,
            this.wallGroup
        );
    }

    // =====================================================
    // ROOM NAME
    // =====================================================

    updateRoomLabel() {

        const letter =
            String.fromCharCode(65 + this.roomX);

        const number =
            this.roomY + 1;

        this.roomText.setText(
            `${letter}${number}`
        );
    }

    // =====================================================
    // WALL CREATION
    // =====================================================

    createWall(x, y) {

        const wall = this.add.rectangle(
            x,
            y,
            TILE_SIZE,
            TILE_SIZE,
            0x666666
        );

        this.physics.add.existing(
            wall,
            true
        );

        this.wallGroup.add(wall);
    }

    // =====================================================
    // ROOM DRAWING
    // =====================================================

    drawRoom() {

        // Remove previous room walls
        this.wallGroup.clear(true, true);

        const gap = Math.floor(ROOM_SIZE / 2);

        // Determine which neighbours exist
        const hasNorth =
            this.roomY > 0;

        const hasSouth =
            this.roomY < WORLD_HEIGHT - 1;

        const hasWest =
            this.roomX > 0;

        const hasEast =
            this.roomX < WORLD_WIDTH - 1;

        // -------------------------
        // TOP + BOTTOM WALLS
        // -------------------------

        for (let x = 0; x < ROOM_SIZE; x++) {

            // Top wall
            if (!(hasNorth && x === gap)) {

                this.createWall(
                    x * TILE_SIZE + TILE_SIZE / 2,
                    TILE_SIZE / 2
                );
            }

            // Bottom wall
            if (!(hasSouth && x === gap)) {

                this.createWall(
                    x * TILE_SIZE + TILE_SIZE / 2,
                    ROOM_PIXELS - TILE_SIZE / 2
                );
            }
        }

        // -------------------------
        // LEFT + RIGHT WALLS
        // -------------------------

        for (let y = 1; y < ROOM_SIZE - 1; y++) {

            // Left wall
            if (!(hasWest && y === gap)) {

                this.createWall(
                    TILE_SIZE / 2,
                    y * TILE_SIZE + TILE_SIZE / 2
                );
            }

            // Right wall
            if (!(hasEast && y === gap)) {

                this.createWall(
                    ROOM_PIXELS - TILE_SIZE / 2,
                    y * TILE_SIZE + TILE_SIZE / 2
                );
            }
        }

        this.updateRoomLabel();
    }

    // =====================================================
    // ROOM TRANSITIONS
    // =====================================================

    moveToRoom(dx, dy) {

        this.roomX += dx;
        this.roomY += dy;

        this.drawRoom();

        // Reposition player inside doorway

        if (dx === 1) {

            this.player.x =
                TILE_SIZE * 1.5;
        }

        if (dx === -1) {

            this.player.x =
                ROOM_PIXELS - TILE_SIZE * 1.5;
        }

        if (dy === 1) {

            this.player.y =
                TILE_SIZE * 1.5;
        }

        if (dy === -1) {

            this.player.y =
                ROOM_PIXELS - TILE_SIZE * 1.5;
        }
    }

    // =====================================================
    // GAME LOOP
    // =====================================================

    update() {

        const speed = 220;

        this.player.body.setVelocity(0);

        if (this.cursors.left.isDown) {

            this.player.body.setVelocityX(
                -speed
            );
        }

        if (this.cursors.right.isDown) {

            this.player.body.setVelocityX(
                speed
            );
        }

        if (this.cursors.up.isDown) {

            this.player.body.setVelocityY(
                -speed
            );
        }

        if (this.cursors.down.isDown) {

            this.player.body.setVelocityY(
                speed
            );
        }

        // -------------------------
        // ROOM CHANGES
        // -------------------------

        if (
            this.player.x < 0 &&
            this.roomX > 0
        ) {
            this.moveToRoom(-1, 0);
        }

        if (
            this.player.x > ROOM_PIXELS &&
            this.roomX < WORLD_WIDTH - 1
        ) {
            this.moveToRoom(1, 0);
        }

        if (
            this.player.y < 0 &&
            this.roomY > 0
        ) {
            this.moveToRoom(0, -1);
        }

        if (
            this.player.y > ROOM_PIXELS &&
            this.roomY < WORLD_HEIGHT - 1
        ) {
            this.moveToRoom(0, 1);
        }
    }
}

// =====================================================
// GAME CONFIG
// =====================================================

const config = {
    type: Phaser.AUTO,

    width: ROOM_PIXELS,
    height: ROOM_PIXELS,

    backgroundColor: "#202020",

    physics: {
        default: "arcade",
        arcade: {
            debug: false
        }
    },

    scene: GameScene
};

// Start game
new Phaser.Game(config);

</script>

</body>
</html>
